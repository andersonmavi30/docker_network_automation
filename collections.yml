---
# Ansible Galaxy collections installed at image build time.
# Versions are pinned here for reproducible builds — the same collection
# version is guaranteed across every docker build regardless of when it runs.
# To upgrade a collection: bump its version and rebuild the image.
collections:
  # ── Cisco ──────────────────────────────────────────────────────────────────
  - name: cisco.ios
    version: "9.0.3"
  - name: cisco.nxos
    version: "9.3.1"
  - name: cisco.asa
    version: "6.0.0"

  # ── Arista ─────────────────────────────────────────────────────────────────
  - name: arista.eos
    version: "10.0.1"

  # ── Juniper ────────────────────────────────────────────────────────────────
  - name: junipernetworks.junos
    version: "9.1.0"

  # ── Aruba / HPE ────────────────────────────────────────────────────────────
  # aoscx: Aruba CX switches (8360, 6300, 6400...) via REST + SSH
  - name: arubanetworks.aoscx
    version: "4.5.1"
  # aos_switch: ArubaOS-Switch / HPE ProVision (2530, 2930, 5400R...)
  - name: arubanetworks.aos_switch
    version: "1.7.0"

  # ── Dell ───────────────────────────────────────────────────────────────────
  # SmartFabric OS10 (S41xx, S52xx, Z9xxx)
  - name: dellemc.os10
    version: "1.2.7"
  # Legacy OS9 (S4048, S6010, Z9100)
  - name: dellemc.os9
    version: "1.0.4"
  # Legacy OS6 (N1500, N2000, N3000, N4000)
  - name: dellemc.os6
    version: "1.0.7"

  # ── Allied Telesis ─────────────────────────────────────────────────────────
  # AlliedWare Plus (x220, x330, x530, x950...)
  - name: alliedtelesis.awplus
    version: "1.3.0"

    # ── Open-source NOS ────────────────────────────────────────────────────────
  # VyOS: open-source router/firewall (rolling + LTS)
  - name: vyos.vyos
    version: "6.0.0"
  # Cumulus Linux (NVIDIA) 5.x via NVUE REST API
  - name: nvidia.nvue
    version: "1.2.9"
  # Dell Enterprise SONiC (open networking)
  - name: dellemc.enterprise_sonic
    version: "4.1.0"
  # FRRouting: open-source routing stack (BGP, OSPF, IS-IS...)
  # Used under the hood by SONiC, Cumulus and VyOS
  - name: frr.frr
    version: "2.0.2"

  # ── Community ──────────────────────────────────────────────────────────────
  - name: community.general
    version: "10.3.1"
  # community.network covers the vendors without a dedicated collection:
  #   exos_*     → Extreme Networks EXOS
  #   ce_*       → Huawei CloudEngine
  #   comware_*  → HP/H3C Comware
  - name: community.network
    version: "5.1.0"
